<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construx Project Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>Construx<span>Project Manager</span></h1>
        </div>
        <nav class="tabs">
            <button class="tab-btn active" data-tab="rfi">RFI Log</button>
            <button class="tab-btn" data-tab="submittal">Submittal Log</button>
        </nav>
    </header>

    <main>
        <!-- RFI Module -->
        <section id="rfi-section" class="tab-content active">
            <div class="toolbar">
                <h2>RFI Log</h2>
                <div class="actions">
                    <button id="export-rfi" class="btn-secondary">Export CSV</button>
                    <button id="add-rfi" class="btn-primary">+ New RFI</button>
                </div>
            </div>
            <div class="table-container">
                <table id="rfi-table">
                    <thead>
                        <tr>
                            <th>RFI #</th>
                            <th>Date</th>
                            <th>Subject</th>
                            <th>Submitted By</th>
                            <th>Assigned To</th>
                            <th>Status</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- Submittal Module -->
        <section id="submittal-section" class="tab-content">
            <div class="toolbar">
                <h2>Submittal Log</h2>
                <div class="actions">
                    <button id="export-submittal" class="btn-secondary">Export CSV</button>
                    <button id="add-submittal" class="btn-primary">+ New Submittal</button>
                </div>
            </div>
            <div class="table-container">
                <table id="submittal-table">
                    <thead>
                        <tr>
                            <th>Sub #</th>
                            <th>Date</th>
                            <th>Spec Section</th>
                            <th>Description</th>
                            <th>Submitted By</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- RFI Modal -->
    <div id="rfi-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="rfi-modal-title">Create RFI</h3>
            <form id="rfi-form">
                <input type="hidden" name="id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>RFI Number</label>
                        <input type="text" name="number" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group col-span-2">
                        <label>Subject</label>
                        <input type="text" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label>Submitted By</label>
                        <input type="text" name="submittedBy" required>
                    </div>
                    <div class="form-group">
                        <label>Assigned To</label>
                        <input type="text" name="assignedTo" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="Open">Open</option>
                            <option value="Pending">Pending</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" name="dueDate" required>
                    </div>
                    <div class="form-group col-span-2">
                        <label>Description</label>
                        <textarea name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group col-span-2">
                        <label>Response</label>
                        <textarea name="response" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary close-modal">Cancel</button>
                    <button type="submit" class="btn-primary">Save RFI</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Submittal Modal -->
    <div id="submittal-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="submittal-modal-title">Create Submittal</h3>
            <form id="submittal-form">
                <input type="hidden" name="id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Submittal Number</label>
                        <input type="text" name="number" required>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>Spec Section</label>
                        <input type="text" name="specSection" required>
                    </div>
                    <div class="form-group">
                        <label>Submitted By</label>
                        <input type="text" name="submittedBy" required>
                    </div>
                    <div class="form-group col-span-2">
                        <label>Description</label>
                        <input type="text" name="description" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                            <option value="Revise and Resubmit">Revise and Resubmit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Remarks</label>
                        <input type="text" name="remarks">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary close-modal">Cancel</button>
                    <button type="submit" class="btn-primary">Save Submittal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
